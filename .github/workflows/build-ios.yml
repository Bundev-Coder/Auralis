name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect and Select Xcode with iOS Platform
        run: |
          echo "=== Initial Default Developer Dir ==="
          xcode-select -p
          xcodebuild -version

          echo "=== Installed Xcode Applications ==="
          ls -d /Applications/Xcode*.app || true

          echo "=== Check Simctl Runtimes on Default Xcode ==="
          xcrun simctl list runtimes || true

          # If the current default Xcode doesn't have an iOS runtime, look for one that does
          if ! xcrun simctl list runtimes 2>/dev/null | grep -q "iOS"; then
            echo "Default Xcode missing iOS runtime. Searching installed Xcode versions..."
            for app in /Applications/Xcode*.app; do
              echo "Testing $app..."
              if DEVELOPER_DIR="$app/Contents/Developer" xcrun simctl list runtimes 2>/dev/null | grep -q "iOS"; then
                echo "Switching to $app which provides iOS runtime!"
                sudo xcode-select -s "$app/Contents/Developer"
                echo "DEVELOPER_DIR=$app/Contents/Developer" >> $GITHUB_ENV
                break
              fi
            done
          else
            echo "Default Xcode already provides iOS runtime."
            echo "DEVELOPER_DIR=$(xcode-select -p)" >> $GITHUB_ENV
          fi

          echo "=== Final Active Xcode ==="
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes || true
          sudo xcodebuild -license accept || true
          sudo xcodebuild -runFirstLaunch || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Patch Swift Packages & Build Scripts
        run: |
          python3 scripts/patch-swift-packages.py

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Setup CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App without Signing
        run: |
          cd ios
          xcodebuild \
            -workspace Auralis.xcworkspace \
            -scheme Auralis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "Auralis.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Auralis.app was not produced in build directory!"
            exit 1
          fi
          echo "Packaging $APP_PATH into IPA..."
          cp -R "$APP_PATH" Payload/
          zip -r Auralis.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-iOS-IPA
          path: ios/Auralis.ipa
          retention-days: 14

      - name: Create or Update GitHub Release with IPA
        run: |
          gh release create v1.0.0 ios/Auralis.ipa --title "Auralis iOS v1.0.0" --notes "Pre-built unsigned IPA package for Auralis iOS. Sideloadable via Sideloadly, AltStore, TrollStore, or Scarlet." --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
