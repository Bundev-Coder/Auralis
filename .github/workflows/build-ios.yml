name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 & Accept License
        run: |
          XCODE_DEV_DIR="/Applications/Xcode_16.2.app/Contents/Developer"
          if [ ! -d "$XCODE_DEV_DIR" ]; then
            XCODE_DEV_DIR="/Applications/Xcode_16.1.app/Contents/Developer"
          fi
          if [ ! -d "$XCODE_DEV_DIR" ]; then
            XCODE_DEV_DIR="/Applications/Xcode_16.app/Contents/Developer"
          fi
          sudo xcode-select -s "$XCODE_DEV_DIR"
          echo "DEVELOPER_DIR=$XCODE_DEV_DIR" >> $GITHUB_ENV
          xcodebuild -version
          sudo xcodebuild -license accept || true
          sudo xcodebuild -runFirstLaunch || true

      - name: Download iOS Platform Runtime
        run: |
          echo "Checking and downloading iOS platform runtime for Xcode 16..."
          sudo xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Patch Package.swift Swift Tools Version & Trailing Commas for Xcode 16.2
        run: |
          python3 scripts/patch-swift-packages.py

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Setup CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App without Signing
        run: |
          cd ios
          xcodebuild \
            -workspace Auralis.xcworkspace \
            -scheme Auralis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "Auralis.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Auralis.app was not produced!"
            exit 1
          fi
          echo "Packaging $APP_PATH into IPA..."
          cp -r "$APP_PATH" Payload/
          zip -r Auralis.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-iOS-IPA
          path: ios/Auralis.ipa
          retention-days: 14

      - name: Create or Update GitHub Release with IPA
        run: |
          gh release create v1.0.0 ios/Auralis.ipa --title "Auralis iOS v1.0.0" --notes "Pre-built unsigned IPA package for iOS. Sideloadable via Sideloadly, AltStore, TrollStore, or Scarlet." --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
